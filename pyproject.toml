[project]
name = "llm-jp-decontam"
version = "0.1.0"
description = "Lists the records of a dataset that share character or token n-grams with a reference dataset"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "sentencepiece>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
